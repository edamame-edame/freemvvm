[workspace]
members = [
    "crates/core-runtime",
    "crates/c-abi",
    "crates/platform-linux",
    "wrappers/rust/freemvvm-sys",
    "wrappers/rust/freemvvm",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
