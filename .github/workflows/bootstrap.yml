name: Development bootstrap

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-bootstrap:
    name: Bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    env:
      PYTHONUTF8: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout source and test inputs at the same revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up standard CPython
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13.12"
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: global.json
      - name: Install exact Rust toolchains
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.85.0 --profile minimal
      - name: Prepare local environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip install -r tools/requirements-dev.txt
      - name: Prepare local environment (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install -r tools/requirements-dev.txt
      - name: Run all bootstrap gates (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe tools/dev.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe tools/dev.py minimum
      - name: Run all bootstrap gates (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./.venv/bin/python tools/dev.py check
          ./.venv/bin/python tools/dev.py minimum
      - name: Retain bootstrap reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bootstrap-${{ matrix.os }}
          path: |
            .local/verification/*.json
            out/cmake/dev/Testing/Temporary/LastTest.log
          if-no-files-found: warn
